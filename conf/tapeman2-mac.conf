# tapeman2 configuration — macOS
# /usr/local/etc/tapeman2/tapeman2.conf
# Run 'sudo tapeman2-setup' to configure interactively

[device]
# SG device for LTFS (via SAS HBA)
sg_device = /dev/sg0

# No-rewind tape device (Mac: nrmt, Linux: nst)
st_device = /dev/nrmt0

# LTFS mount point
mount_point = /Volumes/tape

[paths]
staging_dir = /usr/local/var/tapeman2/staging
restore_dir = /usr/local/var/tapeman2/restore
state_dir   = /usr/local/var/tapeman2
db_path     = /usr/local/var/tapeman2/archives.db
log_file    = /usr/local/var/log/tapeman2/tapeman2.log

[archive]
ltfs_blocksize      = 524288
tar_by_default      = false
checksum_algo       = sha256
min_staging_free_gb = 50

[changer]
enabled       = false
device        = /dev/ch0
drive_count   = 1
slot_count    = 24
ie_slot_count = 1
default_drive = 0

[ui]
date_format = %%Y-%%m-%%d %%H:%%M
page_size   = 20

[notify]
# Email address to notify when background jobs complete or fail.
# Leave blank to disable. Requires a working 'mail' command / MTA.
email =

[archive_warn]
# Warn when a tape will be this percent full or more after an archive (0-1)
capacity_warn_threshold = 0.90
