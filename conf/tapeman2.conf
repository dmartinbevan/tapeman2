# tapeman2 configuration file
# Location: /etc/tapeman2/tapeman2.conf

[device]
# SCSI generic device for LTFS operations (mkltfs, ltfs mount)
sg_device = /dev/sg0

# ST device for mt tape control commands
st_device = /dev/nst0

# LTFS mount point
mount_point = /mnt/tape

[paths]
# Local staging volume - data is staged here before writing to tape
staging_dir = /data/staging

# Restore destination default (users can override at runtime)
restore_dir = /data/restore

# tapeman2 state directory
state_dir = /var/lib/tapeman2

# SQLite database path
db_path = /var/lib/tapeman2/archives.db

# Log file
log_file = /var/log/tapeman2/tapeman2.log

[archive]
# Default block size for LTFS (bytes) - 512KB is good for LTO-9
ltfs_blocksize = 524288

# Whether to tar datasets before writing to tape by default
# Can be overridden per-archive. Recommended for small-file datasets.
tar_by_default = false

# Checksum algorithm: sha256 or md5
checksum_algo = sha256

# Minimum free staging space required before archiving (GB)
min_staging_free_gb = 50

[changer]
# Set enabled = true to activate robotic library support
# Requires 'mtx' to be installed (dnf install mtx)
enabled = false

# SCSI generic device for the media changer (robotic arm)
# Typically /dev/sg1 or /dev/sg2 — use 'lsscsi' to identify
device = /dev/sg1

# Number of tape drives in the library
drive_count = 1

# Number of storage slots in the library
slot_count = 24

# Number of import/export slots (mail slots for adding/removing tapes)
ie_slot_count = 1

# Drive to use by default (0-indexed)
default_drive = 0

[ui]
# Date format for display
date_format = %%Y-%%m-%%d %%H:%%M

# Number of rows to show in archive listings by default
page_size = 20

[notify]
# Email address to notify when background jobs complete or fail.
# Leave blank to disable email notifications.
# Requires a working mail command / local MTA (postfix, sendmail).
email =

[archive_warn]
# Warn when a tape will be this percent full or more after an archive (0-1)
capacity_warn_threshold = 0.90

